name: Fehler melden
description: Reproduzierbaren Fehler in einem Projekt melden
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Danke für deinen Fehlerbericht. Bitte veröffentliche hier keine Zugangsdaten, personenbezogenen Daten oder Details zu Sicherheitslücken.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Was ist passiert?
      placeholder: Beschreibe den Fehler möglichst konkret.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      description: Was hätte stattdessen passieren sollen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zur Reproduktion
      description: Welche Schritte führen zuverlässig zum Problem?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Umgebung
      description: Zum Beispiel Browser, Betriebssystem, Version oder Commit.
      placeholder: Firefox / Ubuntu
  - type: textarea
    id: context
    attributes:
      label: Zusätzlicher Kontext
      description: Logs, Screenshots oder weitere Hinweise. Bitte sensible Daten entfernen.
  - type: checkboxes
    id: checks
    attributes:
      label: Vor dem Absenden
      options:
        - label: Ich habe nach bestehenden Issues gesucht.
          required: true
        - label: Dieses Issue enthält keine Zugangsdaten oder vertraulichen Daten.
          required: true
        - label: Es handelt sich nicht um eine Sicherheitslücke.
          required: true
